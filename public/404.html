<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>this.is — Not found</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #F4EBDA;
        --paper-deep: #ECDFC5;
        --ink: #2E1C0D;
        --ink-soft: #5A4630;
        --ink-mute: #8C7556;
        --edge: rgba(46, 28, 13, 0.10);
        --accent-deep: #A85F2A;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Fraunces', Georgia, serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        width: 100%;
        text-align: center;
        background: var(--paper-deep);
        border: 1px solid var(--edge);
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 18px 60px rgba(46, 28, 13, 0.12);
      }
      .eyebrow {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 11px;
        color: var(--ink-mute);
        margin: 0 0 12px;
      }
      h1 {
        font-size: 38px;
        line-height: 0.95;
        margin: 0 0 12px;
        font-weight: 500;
      }
      .bloom {
        color: var(--accent-deep);
      }
      p {
        font-size: 14px;
        color: var(--ink-soft);
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a.btn {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 9999px;
        background: linear-gradient(180deg, #E5B768, #C28B3F);
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        font-family: inherit;
        box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 8px 16px -8px rgba(46, 28, 13, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="eyebrow">Error · 404</p>
      <h1>Lost the trail<span class="bloom">.</span></h1>
      <p>That page isn't here. It may have moved, or never existed in the first place.</p>
      <a class="btn" href="/">Go home</a>
    </div>
  </body>
</html>
